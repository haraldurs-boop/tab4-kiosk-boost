# Example watchdog config — copy to config/<your-device>.conf and edit.

DEVICE_ID=my-kitchen-tablet         # Short slug for log/state filenames
DEVICE_LABEL="Kitchen Tab 4"        # Human-readable name in ntfy alerts
TABLET_IP=192.168.1.100              # Tablet LAN IP
ADB_PORT=5555                        # Default ADB-over-TCP port

# Kiosk app — if you built kiosk-app/ from this repo, use these:
KIOSK_PACKAGE=is.openclaw.b12kiosk
KIOSK_MAIN_ACTIVITY=is.openclaw.b12kiosk/.MainActivity
# Or if you're still on Fully Kiosk:
# KIOSK_PACKAGE=de.ozerov.fully
# KIOSK_MAIN_ACTIVITY=de.ozerov.fully/.MainActivity

START_URL="https://dashboard.example.com/"

# CPU tuning (Tab 4 has 4 Cortex-A7 cores, 0-3)
CPU_GOVERNOR=performance
BRING_CORES_ONLINE=1
MAX_CORE_INDEX=3

# Launcher — leave 0 if your kiosk app has CATEGORY_HOME in its manifest
DISABLE_LAUNCHER=0
LAUNCHER_PACKAGE=com.android.launcher3

# ntfy alerts (https://ntfy.sh/ or self-hosted)
NTFY_ENABLED=1
NTFY_URL="https://ntfy.sh"
NTFY_TOPIC="your-topic-here"        # Pick something unguessable
NTFY_TAG="my_kitchen_tablet"

# Alert thresholds
ALERT_OFFLINE_MIN=5                 # ntfy if tablet unreachable 5+ min
ALERT_CRASH_COUNT=3                 # ntfy if kiosk crashes N times in
ALERT_CRASH_WINDOW_MIN=60           # ...this many minutes
ALERT_TEMP_C=45                     # ntfy if thermal_zone0 exceeds this
ALERT_BATTERY_LOW_PCT=30            # ntfy if unplugged AND battery < this
ALERT_MEM_FREE_LOW_KB=60000         # ntfy if MemFree < 60 MB sustained
ALERT_DEDUPE_HR=1                   # one alert of each kind per this many hours
